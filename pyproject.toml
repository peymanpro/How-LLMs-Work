[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "howllmswork"
version = "0.2.0"
description = "A from-scratch exploration of LLM mechanics: tokenization, causal objectives, generation, sampling, and KV-cache inference in Python and NumPy."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
